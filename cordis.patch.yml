# dsh-usage-stats bundle patch.
#
# One Host row: it registers the /usage-stats/api prefix route that the Client
# half reads.
#
# `pricing` rules are CNY per 1M tokens and come in two shapes:
#   'provider/model': { rate: 5.25 }                               # one blended price
#   'provider/*':     { cacheMiss: 2, cacheHit: 0.5, output: 8 }    # split price
# Matching order: `provider/model` -> `provider/*` -> `*`. A model with no
# matching rule still counts tokens, but adds no cost (the page lists it).
#
# The values below are PLACEHOLDERS. Replace them with rates derived from your
# own invoice (amount / tokens * 1e6); an invoice states money over tokens and
# never the cache-miss/hit/output split, so the blended `rate` shape is usually
# the honest one.
- insert:
    - id: usage-stats
      name: 'dsh-usage-stats'
      config:
        basis: '示例单价，请按自己的账单改'
        pricing:
          '*':
            rate: 1.0
          'example-provider/*':
            rate: 1.0
          'example-provider/big-model':
            cacheMiss: 15
            cacheHit: 1.5
            output: 75
